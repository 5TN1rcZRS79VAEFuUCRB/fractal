name: Flatpak

# Build the Flatpak and publish it to our Flatpak repository on GitHub Pages,
# so installs get every push to main. For tags, also attach a bundle to the
# release.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

env:
  APP_ID: io.github._5TN1rcZRS79VAEFuUCRB.FractalPlus
  # Inside the build container, so the signing key is gone after each job.
  # Our runner keeps the container's home between jobs, with a lock that
  # blocks the next job's import.
  GNUPGHOME: /tmp/gnupg
  SITE_URL: https://5tn1rczrs79vaefuucrb.github.io/fractalplus
  GPG_FINGERPRINT: 98A45761F7114062A0D0510F29A4EE8A207C1B58

jobs:
  flatpak:
    name: Build Flatpak
    # Our own machine, much faster than GitHub's. Jobs wait for it when it is
    # off. Only pushes to this repository run workflows there: pull requests
    # from forks need approval.
    runs-on: [self-hosted, flatpak]
    # A newer push replaces a build still running for the same branch, but
    # never for a tag.
    concurrency:
      group: ${{ github.workflow }}-build-${{ github.ref }}
      cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
    permissions:
      contents: write
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      # Lower priority than the machine's other work, when it is busy.
      options: --privileged --cpu-shares=256
    steps:
      - uses: actions/checkout@v4

      - name: Import the repository signing key
        env:
          FLATPAK_GPG_KEY: ${{ secrets.FLATPAK_GPG_KEY }}
        run: |
          install -d -m 700 "$GNUPGHOME"
          echo "$FLATPAK_GPG_KEY" | gpg --batch --import

      - uses: flathub-infra/flatpak-github-actions/flatpak-builder@master
        with:
          manifest-path: build-aux/io.github._5TN1rcZRS79VAEFuUCRB.FractalPlus.json
          branch: stable
          build-bundle: false
          upload-artifact: false
          gpg-sign: ${{ env.GPG_FINGERPRINT }}
          # The cache would be uploaded to GitHub, which takes longer than
          # building what it saves on our machine.
          cache: false

      - name: Sign the repository and build the bundle
        run: |
          flatpak build-update-repo --title="Fractal+" --gpg-sign="$GPG_FINGERPRINT" \
            --generate-static-deltas --prune repo
          flatpak build-bundle --gpg-keys=build-aux/repo/fractalplus.gpg \
            --repo-url="$SITE_URL/repo/" \
            --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo \
            repo fractalplus.flatpak "$APP_ID" stable

      - uses: actions/upload-artifact@v4
        with:
          name: fractalplus-x86_64.flatpak
          path: fractalplus.flatpak

      - name: Prepare the website
        run: |
          mkdir site
          cp -r repo site/repo
          cp build-aux/repo/fractalplus.flatpakref build-aux/repo/fractalplus.flatpakrepo \
            build-aux/repo/fractalplus.gpg build-aux/repo/index.html site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Name the bundle after the release
        if: startsWith(github.ref, 'refs/tags/')
        run: mv fractalplus.flatpak "fractalplus-${{ github.ref_name }}-x86_64.flatpak"

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: fractalplus-*.flatpak

  pages:
    name: Publish the Flatpak repository
    needs: flatpak
    runs-on: ubuntu-latest
    # One publish at a time, and a publish that has started is never cancelled,
    # so a newer push can't leave the repository half deployed. A newer one
    # waiting replaces an older one waiting.
    concurrency:
      group: ${{ github.workflow }}-pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
