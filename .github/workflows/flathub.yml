name: Flathub

# Build the Flathub manifest exactly as Flathub does: without network access.
on:
  push:
    branches: [main]
    paths: ["flathub/**", ".github/workflows/flathub.yml"]
  workflow_dispatch:

jobs:
  flathub:
    name: Build Flathub manifest
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged
    steps:
      - uses: actions/checkout@v4

      - uses: flathub-infra/flatpak-github-actions/flatpak-builder@master
        with:
          bundle: fractalplus-flathub.flatpak
          manifest-path: flathub/io.github._5TN1rcZRS79VAEFuUCRB.FractalPlus.json
          cache-key: flathub-builder-${{ github.sha }}

      - name: Run the Flathub linter
        continue-on-error: true
        run: |
          if command -v flatpak-builder-lint >/dev/null; then
            flatpak-builder-lint manifest flathub/io.github._5TN1rcZRS79VAEFuUCRB.FractalPlus.json || true
            flatpak-builder-lint repo repo || true
          else
            flatpak run --command=flatpak-builder-lint org.flatpak.Builder manifest flathub/io.github._5TN1rcZRS79VAEFuUCRB.FractalPlus.json || true
            flatpak run --command=flatpak-builder-lint org.flatpak.Builder repo repo || true
          fi
