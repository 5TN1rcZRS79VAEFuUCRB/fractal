name: Windows and macOS

# Build Fractal+ for Windows and macOS. The data files (resources,
# translations, settings schema) are built on Linux, because their tools don't
# run on the other systems, and the program is built with Cargo alone. For
# tags, the packages are attached to the release.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

# A newer push replaces a build still running for the same branch, but
# never for a tag.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_TERM_COLOR: always
  # The release profile optimizes the whole program in one thread, which
  # takes hours on these small runners. Trade a little speed and size for
  # much shorter builds.
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
  CARGO_PROFILE_RELEASE_LTO: "false"
  CARGO_PROFILE_RELEASE_DEBUG: "false"
  GTK_VERSION: "2026.10.0"
  GST_VERSION: "1.26.11"

jobs:
  data:
    name: Build the data files
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install the build tools
        run: >
          pacman -Syu --noconfirm --needed git pkgconf meson rust gettext blueprint-compiler dart-sass
          desktop-file-utils appstream gtk4 libadwaita gtksourceview5 gstreamer
          gst-plugins-base-libs gst-plugins-bad-libs glycin glycin-gtk4 libwebp libshumate
          sqlite imagemagick librsvg

      - uses: actions/checkout@v4

      - name: Build
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          build-aux/build-data.sh fp-data
          # The icon of the Windows installer and shortcuts.
          magick -background none data/icons/org.gnome.Fractal.svg \
            -define icon:auto-resize=256,64,48,32,16 fp-data/fractalplus.ico

      - uses: actions/upload-artifact@v4
        with:
          name: data
          path: fp-data

  windows:
    name: Build for Windows
    needs: data
    # To attach the package to the release.
    permissions:
      contents: write
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: data
          path: fp-data

      # The .pc files of the GTK bundle point to this folder.
      - name: Install GTK
        run: |
          $gtk = "C:\gtk-build\gtk\x64\release"
          curl.exe -sSfL -o gtk.zip "https://github.com/wingtk/gvsbuild/releases/download/$env:GTK_VERSION/GTK4_Gvsbuild_${env:GTK_VERSION}_x64.zip"
          New-Item -ItemType Directory -Force $gtk | Out-Null
          tar -xf gtk.zip -C $gtk
          Remove-Item gtk.zip
          "GTK_DIR=$gtk" >> $env:GITHUB_ENV

      - name: Install GStreamer
        run: |
          $base = "https://gstreamer.freedesktop.org/data/pkg/windows/$env:GST_VERSION/msvc"
          foreach ($name in "gstreamer-1.0-msvc-x86_64-$env:GST_VERSION.msi", "gstreamer-1.0-devel-msvc-x86_64-$env:GST_VERSION.msi") {
            curl.exe -sSfL -o $name "$base/$name"
            $p = Start-Process msiexec -Wait -PassThru -ArgumentList "/i", $name, "/qn", "INSTALLLEVEL=1000"
            if ($p.ExitCode -ne 0) { throw "Could not install $name ($($p.ExitCode))" }
            Remove-Item $name
          }
          $gst = [Environment]::GetEnvironmentVariable("GSTREAMER_1_0_ROOT_MSVC_X86_64", "Machine")
          if (-not $gst) { $gst = "C:\Program Files\gstreamer\1.0\msvc_x86_64\" }
          $gst = $gst.TrimEnd("\")
          if (-not (Test-Path "$gst\lib\pkgconfig\gstreamer-1.0.pc")) { throw "GStreamer not found in $gst" }
          "GST_DIR=$gst" >> $env:GITHUB_ENV

      - name: Set up the build environment
        run: |
          choco install pkgconfiglite --no-progress -y
          # GTK's GLib comes first, so there is only one, the newer one.
          "PKG_CONFIG_PATH=$env:GTK_DIR\lib\pkgconfig;$env:GST_DIR\lib\pkgconfig" >> $env:GITHUB_ENV
          # The GTK bundle has libintl for gettext.
          "GETTEXT_DIR=$env:GTK_DIR" >> $env:GITHUB_ENV
          Get-ChildItem "$env:GTK_DIR\lib\intl*", "$env:GTK_DIR\bin\intl*" | Select-Object -ExpandProperty Name
          "$env:GST_DIR\bin" >> $env:GITHUB_PATH
          "$env:GTK_DIR\bin" >> $env:GITHUB_PATH
          Copy-Item fp-data\config.rs src\config.rs

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked --bin fractal

      - name: Package
        run: |
          $out = "Fractal+"
          New-Item -ItemType Directory "$out\bin", "$out\lib", "$out\libexec" | Out-Null
          Copy-Item target\release\fractal.exe "$out\bin\fractalplus.exe"
          # GStreamer first, then GTK over it, so only GTK's newer GLib and
          # friends are left.
          Copy-Item "$env:GST_DIR\bin\*.dll" "$out\bin\"
          Copy-Item "$env:GTK_DIR\bin\*.dll" "$out\bin\" -Force
          Copy-Item "$env:GTK_DIR\bin\gdbus.exe" "$out\bin\"
          New-Item -ItemType Directory "$out\lib\gstreamer-1.0" | Out-Null
          Copy-Item "$env:GST_DIR\lib\gstreamer-1.0\*.dll" "$out\lib\gstreamer-1.0\"
          Copy-Item "$env:GST_DIR\libexec\gstreamer-1.0" "$out\libexec\" -Recurse
          if (Test-Path "$env:GTK_DIR\lib\gdk-pixbuf-2.0") {
            Copy-Item "$env:GTK_DIR\lib\gdk-pixbuf-2.0" "$out\lib\" -Recurse
          }
          Copy-Item "$env:GTK_DIR\share" "$out\" -Recurse -Exclude doc, gtk-doc, man, aclocal, gettext, vala, gir-1.0
          Copy-Item fp-data\share\* "$out\share\" -Recurse -Force
          glib-compile-schemas "$out\share\glib-2.0\schemas"
          Copy-Item README.md, COPYING "$out\" -ErrorAction SilentlyContinue
          Compress-Archive -Path $out -DestinationPath fractalplus-windows-x86_64.zip

      - name: Make the installer
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y
          }
          $version = (Select-String -Path meson.build -Pattern "version: '([0-9.]+)'").Matches[0].Groups[1].Value
          & $iscc "/DVersion=$version" "/DSourceDir=$PWD\Fractal+" "/DIconFile=$PWD\fp-data\fractalplus.ico" "/O$PWD" build-aux\windows\fractalplus.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }

      - name: Check that it starts
        timeout-minutes: 5
        run: |
          $env:RUST_LOG = "fractal=debug"
          $env:RUST_BACKTRACE = "1"
          # Test the installed copy, which also tests the installer.
          $setup = Start-Process .\fractalplus-windows-x86_64-setup.exe -Wait -PassThru -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/CURRENTUSER", "/NORESTART"
          if ($setup.ExitCode -ne 0) { throw "The installer failed with $($setup.ExitCode)" }
          $app = "$env:LOCALAPPDATA\Programs\Fractal+"
          if (-not (Test-Path "$app\bin\fractalplus.exe")) { throw "Fractal+ was not installed in $app" }
          if (-not (Test-Path "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\Fractal+.lnk")) { throw "No Start menu shortcut" }
          $p = Start-Process "$app\bin\fractalplus.exe" -PassThru -RedirectStandardOutput start.out -RedirectStandardError start.err
          Start-Sleep 20
          Get-Content start.out, start.err | Select-Object -Last 60
          if ($p.HasExited) { throw "Fractal+ exited with $('0x{0:X8}' -f $p.ExitCode)" }
          Stop-Process $p
          if (Select-String -Quiet "Failed to load plugin" start.out, start.err) { throw "A GStreamer plugin did not load" }
          Start-Sleep 3
          $uninstall = Start-Process "$app\unins000.exe" -Wait -PassThru -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART"
          if ($uninstall.ExitCode -ne 0) { throw "The uninstaller failed with $($uninstall.ExitCode)" }

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && hashFiles('fractalplus-windows-x86_64.zip') != '' }}
        with:
          name: fractalplus-windows-x86_64
          path: |
            fractalplus-windows-x86_64-setup.exe
            fractalplus-windows-x86_64.zip

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            fractalplus-windows-x86_64-setup.exe
            fractalplus-windows-x86_64.zip

  macos:
    name: Build for macOS
    needs: data
    # To attach the package to the release.
    permissions:
      contents: write
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: data
          path: fp-data

      - name: Install the libraries
        run: |
          brew install pkgconf gtk4 libadwaita gtksourceview5 libshumate gstreamer gettext dylibbundler librsvg
          cp fp-data/config.rs src/config.rs
          echo "GETTEXT_DIR=$(brew --prefix gettext)" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked --bin fractal

      - name: Package
        timeout-minutes: 20
        run: build-aux/macos/package.sh target/release/fractal fp-data

      - name: Check that it starts
        timeout-minutes: 5
        run: |
          RUST_LOG=fractal=debug RUST_BACKTRACE=1 "Fractal+.app/Contents/MacOS/fractalplus" > start.log 2>&1 &
          pid=$!
          sleep 20
          tail -60 start.log
          if ! kill -0 $pid 2>/dev/null; then wait $pid; echo "Fractal+ exited with $?"; exit 1; fi
          kill $pid
          if grep -q "Failed to load plugin" start.log; then echo "A GStreamer plugin did not load"; exit 1; fi

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && hashFiles('fractalplus-macos-arm64.dmg') != '' }}
        with:
          name: fractalplus-macos-arm64
          path: fractalplus-macos-arm64.dmg

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: fractalplus-macos-arm64.dmg
